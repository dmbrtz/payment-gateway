services:
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: payment-kafka-init

    depends_on:
      - kafka

    environment:
      KAFKA_TOPICS: "payment.commands payment.events"

    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do sleep 2; done
        
        for topic in $${KAFKA_TOPICS}; do
        
          echo "Creating topic: $$topic"
        
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        
        done
        
        echo "Kafka topics initialized"
  kafka:
    image: apache/kafka:4.3.1
    container_name: payment-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: CONTROLLER://:9093,EXTERNAL://:9092,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    restart: unless-stopped
  postgres:
    image: postgres:17
    container_name: payment-postgres

    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment_gateway

    ports:
      - "5432:5432"

    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U payment -d payment_gateway" ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped
  prometheus:
    image: prom/prometheus:latest
    container_name: payment-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - worker
  grafana:
    image: grafana/grafana:latest
    container_name: payment-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: payment-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api

    container_name: payment-api

    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: payment.commands
      KAFKA_EVENTS_TOPIC: payment.events
      KAFKA_PROJECTION_GROUP_ID: payment-projection
      KAFKA_GROUP_ID: payment-worker
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://payment:payment@postgres:5432/payment_gateway?sslmode=disable

    ports:
      - "8080:8080"

    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: worker

    container_name: payment-worker

    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: payment.commands
      KAFKA_EVENTS_TOPIC: payment.events
      KAFKA_PROJECTION_GROUP_ID: payment-projection
      KAFKA_GROUP_ID: payment-worker
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://payment:payment@postgres:5432/payment_gateway?sslmode=disable

    ports:
      - "9091:9091"

    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: migrate

    container_name: payment-migrate

    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: payment.commands
      KAFKA_EVENTS_TOPIC: payment.events
      KAFKA_PROJECTION_GROUP_ID: payment-projection
      KAFKA_GROUP_ID: payment-worker
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://payment:payment@postgres:5432/payment_gateway?sslmode=disable

    depends_on:
      postgres:
        condition: service_healthy
  callback:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: callback

    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: payment.commands
      KAFKA_GROUP_ID: payment-worker
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://payment:payment@postgres:5432/payment_gateway?sslmode=disable
      KAFKA_EVENTS_TOPIC: payment.events

    ports:
      - "8082:8080"

    depends_on:
      - kafka
  projection:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: projection

    container_name: payment-projection

    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: payment.commands
      KAFKA_EVENTS_TOPIC: payment.events
      KAFKA_GROUP_ID: payment-worker
      KAFKA_PROJECTION_GROUP_ID: payment-projection
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://payment:payment@postgres:5432/payment_gateway?sslmode=disable

    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully


volumes:
  payment_postgres_data: